# 备选方案：不用 Caddy 时，把这份配置放进 /etc/nginx/conf.d/mouke.conf。
# 证书路径按实际替换；80 端口只做跳转，正式流量必须走 443。
server {
    listen 80;
    server_name mouke.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mouke.example.com;

    ssl_certificate     /etc/letsencrypt/live/mouke.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mouke.example.com/privkey.pem;

    root /srv/web;
    index index.html;

    # 图片上传上限与后端一致（15MB），留一点协议开销。
    client_max_body_size 16m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 接口可能跑 45 秒，不能沿用默认 60 秒以下的读超时。
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带哈希的构建产物可以长缓存；index.html 必须每次回源，否则发版后用户
    # 会继续加载旧文件名。
    location /assets/ {
        try_files $uri =404;
        # 用 expires 而不是 add_header：location 里一旦出现 add_header，
        # 父级的全部 add_header 都不再继承，安全响应头会丢。
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
